[project]
name = "shipproof"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "google-genai==3.1.0",
    "httpx==0.28.1",
    "playwright==1.65.0",
    "langchain-core==1.7.7",
    "google-api-python-client==2.202.0",
    "google-auth-oauthlib==1.5.0",
    "langgraph==1.2.20",
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
